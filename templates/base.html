<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PAMIR ESTATE — Агентство недвижимости{% endblock %}</title>
    <meta name="description" content="{% block description %}PAMIR ESTATE — агентство недвижимости. Подбор новостроек, вторичного жилья и загородных домов. Бесплатная консультация.{% endblock %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-sticky shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center p-0" href="{{ url_for('index') }}">
                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 900 260"
                     class="brand-logo"
                     role="img"
                     aria-label="PAMIR ESTATE">
                    <circle cx="140" cy="130" r="82" fill="none"
                            stroke="#C9A96A" stroke-width="0.7" opacity="0.6"/>
                    <path d="M 82 168 L 118 108 L 138 134 L 158 100 L 198 168 Z"
                          fill="#EDE6D6"/>
                    <path d="M 146 120 L 158 100 L 170 120 L 164 116 L 158 122 L 152 116 Z"
                          fill="#C9A96A"/>
                    <circle cx="95" cy="90" r="4.5" fill="none"
                            stroke="#C9A96A" stroke-width="0.8"/>
                    <text x="270" y="122"
                          font-family="'Cormorant Garamond','Playfair Display',serif"
                          font-size="60" font-weight="500"
                          letter-spacing="18" fill="#EDE6D6">PAMIR</text>
                    <line x1="272" y1="144" x2="505" y2="144"
                          stroke="#C9A96A" stroke-width="0.7" opacity="0.55"/>
                    <text x="272" y="178"
                          font-family="'Montserrat','Inter',sans-serif"
                          font-size="15" font-weight="500"
                          letter-spacing="16" fill="#D9B97A">ESTATE</text>
                </svg>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('catalog') }}">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('catalog', type='new') }}">Новостройки</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('catalog', type='secondary') }}">Вторичка</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('catalog', type='country') }}">Загородная</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p>&copy; 2026 PAMIR ESTATE. Все права защищены.</p>
            <p>Телефон: +7 (495) 123-45-67 | Email: mazambekov.safdar@mail.ru</p>
            <p class="mb-0">
                <a href="{{ url_for('admin_login') }}" class="text-white-50 small">Админ-панель</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
